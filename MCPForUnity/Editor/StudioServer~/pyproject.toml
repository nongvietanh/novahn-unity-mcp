[project]
name = "novahn-studio-hub"
version = "0.1.0"
description = "Project-local coordination service for Novahn Studio"
requires-python = ">=3.10"
dependencies = ["fastmcp>=3.0.2,<4", "httpx>=0.27.2", "uvicorn>=0.35.0"]
license = "MIT"

[project.scripts]
novahn-studio-hub = "hub.__main__:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
